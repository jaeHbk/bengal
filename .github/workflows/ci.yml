name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: g++
          - os: ubuntu-latest
            compiler: clang++
          - os: macos-15
            compiler: clang++

    runs-on: ${{ matrix.os }}
    env:
      CXX: ${{ matrix.compiler }}

    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBENGAL_BUILD_BENCHMARKS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Benchmark smoke test
        run: ./build/bengal_benchmarks --iterations=10000 --samples=3

      - name: Verify installation
        run: cmake --install build --prefix build/install

      - name: Configure installed-package consumer
        run: >
          cmake -S tests/consumer -B build/consumer
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/build/install"

      - name: Build installed-package consumer
        run: cmake --build build/consumer --parallel

      - name: Run installed-package consumer
        run: ./build/consumer/bengal_consumer

  sanitizers:
    runs-on: ubuntu-latest
    env:
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  thread-sanitizer:
    runs-on: ubuntu-latest
    env:
      CXX: g++
      TSAN_OPTIONS: halt_on_error=1:history_size=7

    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-O1 -fsanitize=thread -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  fuzz:
    runs-on: ubuntu-latest
    env:
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=OFF
          -DBENGAL_BUILD_TESTS=OFF
          -DBENGAL_BUILD_FUZZERS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Fuzz short strings
        run: ./build/bengal_short_string_fuzz -runs=25000

      - name: Fuzz static buffer resource
        run: ./build/bengal_static_buffer_resource_fuzz -runs=25000

  established-baselines:
    runs-on: ubuntu-latest
    env:
      CXX: g++

    steps:
      - uses: actions/checkout@v5

      - name: Install Boost.StaticString
        run: |
          sudo apt-get update
          sudo apt-get install --yes libbenchmark-dev libboost-dev

      - name: Record hardware metadata
        run: |
          mkdir -p benchmark-artifacts
          uname -a | tee benchmark-artifacts/hardware.txt
          lscpu | tee -a benchmark-artifacts/hardware.txt

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DBENGAL_BUILD_TESTS=OFF
          -DBENGAL_BUILD_BENCHMARKS=ON
          -DBENGAL_BUILD_GOOGLE_BENCHMARKS=ON
          -DBENGAL_BUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Run native established baselines
        run: >
          ./build/bengal_benchmarks
          --iterations=100000
          --samples=1001
          | tee benchmark-artifacts/native-results.txt

      - name: Run Google Benchmark cross-checks
        run: >
          ./build/bengal_google_benchmarks
          --benchmark_min_time=0.05s
          --benchmark_repetitions=5
          --benchmark_report_aggregates_only=true
          --benchmark_out=benchmark-artifacts/google-results.json
          --benchmark_out_format=json
          | tee benchmark-artifacts/google-results.txt

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: bengal-performance-${{ github.sha }}
          path: benchmark-artifacts/
          if-no-files-found: error
